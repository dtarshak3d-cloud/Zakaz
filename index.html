<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Быстрый заказ Аршаку</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .mic-btn { width: 72px; height: 72px; border-radius: 50%; border: none; background: #3b82f6; color: white; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; box-shadow: 0 4px 15px rgba(59,130,246,0.4); transition: 0.2s; }
    .mic-btn.recording { background: #ef4444; box-shadow: 0 0 0 8px rgba(239,68,68,0.25); transform: scale(1.05); }
    .mic-status { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
    textarea, input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
    textarea:focus, input:focus { outline: none; border-color: #3b82f6; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .courier-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
    .toggle-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; }
    .toggle-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
    .submit-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #10b981; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(16,185,129,0.35); }
    .submit-btn:active { transform: scale(0.98); }
    .clear-btn { background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; text-decoration: underline; }
    .error-msg { color: #f87171; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🦷 Быстрый заказ Аршаку</h1>
  <div class="subtitle">Версия 3.2 • Голосовой наряд</div>

  <div class="card">
    <div class="card-title">
      <span>1. Голосовой диктофон 🎙</span>
      <button type="button" class="clear-btn" id="clearBtn">Очистить всё</button>
    </div>
    <button type="button" class="mic-btn" id="micBtn">🎤</button>
    <div class="mic-status" id="micStatus">Нажмите на микрофон и продиктуйте заказ</div>
    <textarea id="rawText" rows="3" placeholder="Назовите: ID пациента, тип конструкции, материал, цвет и адрес/время курьера..."></textarea>
  </div>

  <div class="card">
    <div class="card-title">
      <span>2. Параметры заказа</span>
      <span style="font-size:12px; color:#38bdf8;">Курьер</span>
    </div>

    <label>ID пациента</label>
    <input type="text" id="pId" placeholder="Например: 4512">

    <div class="row">
      <div>
        <label>Тип конструкции</label>
        <input type="text" id="pType" placeholder="Коронка, мост...">
      </div>
      <div>
        <label>Материал</label>
        <input type="text" id="pMat" placeholder="Цирконий, E-max...">
      </div>
    </div>

    <label>Цвет</label>
    <input type="text" id="pCol" placeholder="Например: A2, B1">

    <label>Доставка</label>
    <div class="courier-toggle">
      <button type="button" class="toggle-btn active" id="btnCourier">Нужен курьер</button>
      <button type="button" class="toggle-btn" id="btnSelf">Сами привезём</button>
    </div>

    <div id="courierBox">
      <label>Курьер: адрес и время</label>
      <input type="text" id="pCour" placeholder="Адрес клиники, к какому времени забрать">
    </div>
  </div>

  <div class="error-msg" id="errMsg"></div>
  <button type="button" class="submit-btn" id="sendBtn">Перенести в Яндекс Форму ➔</button>
</div>

<script>
  const $ = id => document.getElementById(id);

  // Настройки вашей Яндекс Формы (все ID уже вписаны)
  const CFG = {
    formUrl: 'https://yandex.ru',
    fId:   'answer_short_text_9008994757384950',
    fType: 'answer_short_text_9008994757427168',
    fMat:  'answer_short_text_9008994757468248',
    fCol:  'answer_short_text_9008994757485004',
    fCour: 'answer_short_text_9008994757499984'
  };

  let needCourier = true;

  // Переключатель курьера
  $('btnCourier').onclick = () => {
    needCourier = true;
    $('btnCourier').classList.add('active');
    $('btnSelf').classList.remove('active');
    $('courierBox').style.display = 'block';
  };

  $('btnSelf').onclick = () => {
    needCourier = false;
    $('btnSelf').classList.add('active');
    $('btnCourier').classList.remove('active');
    $('courierBox').style.display = 'none';
  };

  // Очистка полей
  $('clearBtn').onclick = () => {
    ['rawText', 'pId', 'pType', 'pMat', 'pCol', 'pCour'].forEach(id => $(id).value = '');
  };

  // Авторазбор текста по полям
  function parse(text) {
    const t = text.toLowerCase();

    // 1. ID пациента
    const idM = text.match(/(?:id|айди|номер|карта|пациент)\s*[:№-]?\s*([a-zа-я0-9-]+)/i);
    if (idM && idM[1]) $('pId').value = idM[1];

    // 2. Тип конструкции
    if (/коронк/.test(t)) $('pType').value = 'Коронка';
    else if (/мост/.test(t)) $('pType').value = 'Мост';
    else if (/вкладк/.test(t)) $('pType').value = 'Вкладка';
    else if (/винир/.test(t)) $('pType').value = 'Винир';
    else if (/протез/.test(t)) $('pType').value = 'Протез';
    else if (/абатмент/.test(t)) $('pType').value = 'Абатмент';
    else if (/капп|кап[аы]/.test(t)) $('pType').value = 'Каппа';

    // 3. Материал
    if (/циркон/.test(t)) $('pMat').value = 'Диоксид циркония';
    else if (/е-?макс|emax|имакс/.test(t)) $('pMat').value = 'E-max';
    else if (/металлокерам/.test(t)) $('pMat').value = 'Металлокерамика';
    else if (/керам/.test(t)) $('pMat').value = 'Керамика';
    else if (/акрил/.test(t)) $('pMat').value = 'Акрил';
    else if (/пластмасс|pmma|пмма/.test(t)) $('pMat').value = 'PMMA (пластмасса)';

    // 4. Цвет (Vita A1-D4, Bleach)
    const cM = text.match(/\b([a-dа-д][1-4]|bl[1-4]|блеч\s*[1-4])\b/i);
    if (cM && cM[1]) {
      $('pCol').value = cM[1].toUpperCase()
        .replace('А', 'A')
        .replace('В', 'B')
        .replace('С', 'C')
        .replace('Д', 'D');
    }

    // 5. Курьер / адрес / время
    if (/сами привез|без курьер/.test(t)) {
      $('btnSelf').click();
    } else {
      const courM = text.match(/(?:курьер|адрес|забрать|клиника)\s*[:,-]?\s*(.+)/i);
      if (courM && courM[1]) {
        $('btnCourier').click();
        $('pCour').value = courM[1].trim();
      }
    }
  }

  // Ручное редактирование текста тоже запускает авторазбор
  $('rawText').addEventListener('input', () => parse($('rawText').value));

  // Голосовой ввод (Web Speech API)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isRecording = true;
      $('micBtn').classList.add('recording');
      $('micBtn').textContent = '⏹';
      $('micStatus').textContent = 'Идёт запись... Говорите';
    };

    recognition.onend = () => {
      isRecording = false;
      $('micBtn').classList.remove('recording');
      $('micBtn').textContent = '🎤';
      $('micStatus').textContent = 'Нажмите на микрофон и продиктуйте заказ';
    };

    recognition.onerror = (e) => {
      $('micStatus').textContent = 'Ошибка микрофона: ' + e.error;
    };

    recognition.onresult = (event) => {
      let finalStr = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalStr += event.results[i][0].transcript + ' ';
        }
      }
      if (finalStr) {
        $('rawText').value += finalStr;
        parse($('rawText').value);
      }
    };

    $('micBtn').onclick = () => {
      if (!isRecording) recognition.start();
      else recognition.stop();
    };
  } else {
    $('micStatus').textContent = 'Браузер не поддерживает голосовой ввод (откройте в Chrome или Safari)';
  }

  // Перенос данных в Яндекс Форму
  $('sendBtn').onclick = () => {
    const params = new URLSearchParams();

    if ($('pId').value.trim())   params.append(CFG.fId,   $('pId').value.trim());
    if ($('pType').value.trim()) params.append(CFG.fType, $('pType').value.trim());
    if ($('pMat').value.trim())  params.append(CFG.fMat,  $('pMat').value.trim());
    if ($('pCol').value.trim())  params.append(CFG.fCol,  $('pCol').value.trim());

    const courierText = needCourier
      ? ($('pCour').value.trim() || 'Нужен курьер')
      : 'Сами привезём';
    params.append(CFG.fCour, courierText);

    const finalUrl = CFG.formUrl + (CFG.formUrl.includes('?') ? '&' : '?') + params.toString();
    window.open(finalUrl, '_blank');
  };
</script>
</body>
</html>
