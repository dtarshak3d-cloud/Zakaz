<script>
  const GAS_URL = 'https://' + 'script.google' + '.com/macros/s/AKfycbyeHWKmbbvUtTkhXHeXSmJn9Zby9qfhziAqXFg0K0ACnE6dpIRxnVzZdZjDg912HVsXrg/exec';
  const $ = id => document.getElementById(id);

  $('sendBtn').onclick = async () => {
    const btn = $('sendBtn');
    btn.disabled = true;
    $('sendStatus').textContent = 'Отправляем на Dt.Arshak@yandex.ru...';
    try {
      const q = new URLSearchParams({
        action: 'sendEmail',
        doctor: $('pDoc') ? $('pDoc').value : '',
        id: $('pId') ? $('pId').value : '',
        type: $('pType') ? $('pType').value : '',
        material: $('pMat') ? $('pMat').value : '',
        color: $('pCol') ? $('pCol').value : '',
        courier: $('pCour') ? $('pCour').value : '',
        note: $('pNote') ? $('pNote').value : '',
        photo: $('pPhoto') ? $('pPhoto').value : '',
        rawText: $('rawText') ? $('rawText').value : ''
      });
      await fetch(GAS_URL + '?' + q.toString(), { mode: 'no-cors' });
      $('sendStatus').textContent = '✓ Отправлено на Dt.Arshak@yandex.ru!';
    } catch (e) {
      $('sendStatus').textContent = 'Ошибка: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  };

  if (localStorage.getItem('zakaz_doc') && $('pDoc')) $('pDoc').value = localStorage.getItem('zakaz_doc');
  if ($('pDoc')) $('pDoc').addEventListener('input', e => localStorage.setItem('zakaz_doc', e.target.value));

  function localParse(raw) {
    const txt = String(raw || '').trim();
    if (!txt) return;
    const low = txt.toLowerCase();
    let noteRest = txt;
    const rm = rx => { noteRest = noteRest.replace(rx, ' '); };
    const cap = s => String(s || '').trim().replace(/\s+/g, ' ').replace(/(^|\s)\S/g, l => l.toUpperCase());

        const docBefore = txt.match(/^([^,.;\d]+?)\s+(?:врач|доктор|фреш)\b/i);
    const docAfter = txt.match(/(?:врач|доктор|фреш|клиника)\s+([^,.;\d]+?)(?=\s+(?:пациент|ид|id|номер|карта|№|одна|один|одну|две|два|три|четыре|пять|шесть|корон|винир|мост|протез|вклад|абатмент|капа|шаблон|циркон|дисиликат|силикат|материал|цвет|курьер|адрес|$)|[,.;\d]|$)/i);
    const docM = docBefore || docAfter;
    if (docM && docM.at(1) && $('pDoc')) { $('pDoc').value = cap(docM.at(1)); localStorage.setItem('zakaz_doc', $('pDoc').value); rm(docM.at(0)); }
    const idM = noteRest.match(/(?:пациент[а-я]*|ид|id|номер|карта|№)\s*(?:в|на)?\s*(\d{1,3}[:\-\s]?\d{2,4})/i) || noteRest.match(/\b(\d{3,6})\b/);
        const famM = noteRest.match(/(?:пациент[а-я]*|фамили[яи]|для)\s*(?::|\s)\s*([а-яёa-z-]{2,})(?=\s+(?:одна|один|одну|две|два|три|четыре|пять|шесть|корон|винир|мост|протез|вклад|абатмент|капа|шаблон|циркон|дисиликат|акрил|пластмасс|титан|кхс|золот|керамик|цвет|достав|курьер|врач|доктор|фото|олон|фоллон|alone|полон|вс[её]|all|на\s+балк|балк|на\s+мульт|мульт|мю\b|муа\b|medentik|медентик|straumann|штрауман|страус|osstem|осстем|астем|nobel|нобел|astra|астр|neodent|неодент|dentium|дентиум|ankylos|анкилос|megagen|мегаджен|anyridge|эниридж|alpha|альфа|mis\b|мис\b)|[.,;!?\s]|$)/i);
    const idParts = [];
    if (famM && famM.at(1)) { idParts.push(cap(famM.at(1))); rm(famM.at(0)); }
    if (idM && idM.at(1)) { idParts.push(idM.at(1).replace(/[:\-\s]/g, '')); rm(idM.at(0)); }
    if (idParts.length && $('pId')) $('pId').value = idParts.join(' ');

        const numW = {'одна':1,'один':1,'одну':1,'две':2,'два':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19,'двадцать':20,'двадцать одна':21,'двадцать два':22,'двадцать две':22,'двадцать три':23,'двадцать четыре':24,'двадцать пять':25,'двадцать шесть':26,'двадцать семь':27,'двадцать восемь':28};
       const toN = s => s ? (numW[s.toLowerCase().trim()] || parseInt(s, 10) || 0) : 0;
    const tRules = [
      ['балочн[а-я]*\\s+конструкц[а-я]*|протез[а-я]*\\s+на\\s+балк[а-я]*|балк[а-я]*', n => n > 1 ? `${n} балочных конструкций` : 'Балочная конструкция'],
      ['корон[очк]*[а-я]*\\s+на\\s+имплант|коронок\\s+на\\s+имплант|коронки\\s+на\\s+имплант|коронка\\s+на\\s+имплант|на\\s+имплант', n => n > 1 ? `${n} ${n < 5 ? 'коронки' : 'коронок'} на имплантатах` : (n === 1 ? '1 коронка на имплантате' : 'Коронка на имплантате')],
      ['корон[очк]*[а-я]*\\s+на\\s+своих|коронок\\s+на\\s+своих|коронки\\s+на\\s+своих|коронка\\s+на\\s+своих|корон[очк]*[а-я]*\\s+на\\s+культ|коронок\\s+на\\s+культ|коронки\\s+на\\s+культ|коронка\\s+на\\s+культ|корон[очк]*[а-я]*\\s+на\\s+кольц|на\\s+культ|на\\s+кольц|на\\s+своих\\s+зуб', n => n > 1 ? `${n} ${n < 5 ? 'коронки' : 'коронок'} на культе` : (n === 1 ? '1 коронка на культе' : 'Коронка на культе')],
           ['временн[а-я]*\\s+корон[очк]*|времян[очк]*', n => n > 1 ? `${n} временных коронок` : (n === 1 ? '1 временная коронка' : 'Временная коронка')],
      ['прототип[а-я]*', n => n > 1 ? `${n} ${n < 5 ? 'прототипа' : 'прототипов'}` : (n === 1 ? '1 прототип' : 'Прототип')],
      ['корон[очк]*[а-я]*', n => n > 1 ? `${n} ${n < 5 ? 'коронки' : 'коронок'}` : (n === 1 ? '1 коронка' : 'Коронка')],
      ['мостовидн[а-я]*\\s+протез[а-я]*|мост[а-я]*', n => n > 1 ? `${n} мостовидных протеза` : 'Мостовидный протез'],
      ['винир[а-я]*\\s+на\\s+рефрактор[а-я]*|на\\s+рефрактор[а-я]*', n => n > 1 ? `${n} ${n < 5 ? 'винира' : 'виниров'} на рефракторе` : (n === 1 ? '1 винир на рефракторе' : 'Винир на рефракторе')],
      ['винир[а-я]*', n => n > 1 ? `${n} ${n < 5 ? 'винира' : 'виниров'}` : (n === 1 ? '1 винир' : 'Винир')],
      ['вклад[а-я]*', n => n > 1 ? `${n} ${n < 5 ? 'вкладки' : 'вкладок'}` : (n === 1 ? '1 вкладка' : 'Вкладка')],
      ['абатмент[а-я]*', n => n > 1 ? `${n} индивидуальных абатментов` : 'Индивидуальный абатмент'],
      ['бюгел[а-я]*', () => 'Бюгельный протез'], ['протез[а-я]*', () => 'Съемный протез'], ['кап[а-я]*', () => 'Капа'], ['шаблон[а-я]*', () => 'Хирургический шаблон']
    ];
    let foundTypes = [];
    for (const [pat, fmt] of tRules) {
      const rx = new RegExp('(?:(\\d{1,2}|двадцать\\s+(?:одна|два|две|три|четыре|пять|шесть|семь|восемь)|одна|один|одну|две|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать|тринадцать|четырнадцать|пятнадцать|шестнадцать|семнадцать|восемнадцать|девятнадцать|двадцать)\\s+(?:[а-яё-]+\\s+){0,2})?(?:' + pat + ')', 'i');
      low.replace(rx, (m, q) => { const n = toN(q); foundTypes.push(fmt(n)); rm(rx); return ''; });
    }
    const edM = low.match(/\b(\d{1,2}|двадцать\s+(?:одна|два|две|три|четыре|пять|шесть|семь|восемь)|одна|один|одну|две|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать|тринадцать|четырнадцать|пятнадцать|шестнадцать|семнадцать|восемнадцать|девятнадцать|двадцать)\s+(?:ед\.?|единиц[а-я]*)\b/i);
    if (edM && edM.at(1)) { const n = toN(edM.at(1)); if (n > 0) { foundTypes.push(n + ' ед.'); rm(edM.at(0)); } }
    let extras = [];
              const allOn = low.match(/(?:вс[её]\s+на|all[\s-]*on[\s-]*|alone\s+(?:for|four|fuck|six)|олон\s*фоллон|фоллон|олонх[а-я]*|олонф[а-я]*|олон|полон\s*фу[а-я]*)\s*(\d{1,2}|четыр[а-я]*|шест[а-я]*|восьм[а-я]*|for|four|fuck|фон[а-я]*|six)?/i);
    if (allOn) {
      const full = allOn.at(0).toLowerCase();
      const w = (allOn.at(1) || '').toLowerCase();
      const n = toN(w) || (w.startsWith('четыр') || w === 'for' || w === 'four' || w === 'fuck' || w.startsWith('фон') || full.includes('фу') || full.includes('for') || full.includes('fuck') ? 4 : (w.startsWith('шест') || w === 'six' ? 6 : (w.startsWith('восьм') ? 8 : 0)));
      if (n > 0) extras.push(`All-on-${n} (на ${n} опорах)`);
      if (n === 0 && !foundTypes.some(t => t.includes('Балоч'))) foundTypes.push('All-on-4 / Балочная конструкция');
      rm(allOn.at(0));
    }
    const opM = low.match(/(?:на\s+)?(\d{1,2}|одна|один|одну|две|два|три|четыре|четыр[её]х|пять|пят[иь]|шесть|шест[иь]|семь|сем[иь]|восемь|восьм[иь])\s+опор[а-я]*/i);
    const prM = low.match(/(\d{1,2}|одна|один|одну|две|два|три|четыре|пять|шесть|семь|восемь)\s+промежут[а-я]*(?:\s+част[а-я]*)?/i);
    if (opM || prM) {
      let sp = [];
      if (opM && opM.at(1)) { const w = opM.at(1).toLowerCase(); const n = toN(w) || (w.startsWith('четыр') ? 4 : (w.startsWith('пят') ? 5 : (w.startsWith('шест') ? 6 : (w.startsWith('сем') ? 7 : (w.startsWith('восьм') ? 8 : 0))))); if (n > 0) sp.push(`опор: ${n}`); rm(opM.at(0)); }
      if (prM && prM.at(1)) { const n = toN(prM.at(1)); if (n > 0) sp.push(`промеж.: ${n}`); rm(prM.at(0)); }
      if (sp.length) extras.push(sp.join(', '));
    }
           const rxOd = new RegExp('(?:^|\\s)(?:одиночк[а-я]*|одиночн[а-я]*|отдельн[а-я]*|раздельн[а-я]*|не\\s+соединят[а-я]*)(?=[\\s.,;!?]|$)', 'gi');
    const rxMs = new RegExp('(?:^|\\s)(?:мостом|мост|спаят[а-я]*|соединит[а-я]*|соедин[её]нн[а-я]*|объединит[а-я]*)(?=[\\s.,;!?]|$)', 'gi');
    if (rxOd.test(low)) { extras.push('одиночками'); rm(rxOd); }
    else if (rxMs.test(low)) { extras.push('мостом'); rm(rxMs); }
    if (foundTypes.length && $('pType')) {
      const base = [...new Set(foundTypes)].join(', ');
      $('pType').value = extras.length ? `${base} (${extras.join('; ')})` : base;
    }
            const mats = [['акрил[а-я]*','Акрил'],['3[\\s-]*[дd][\\s-]*печат|три\\s*дэ\\s*печат|фотополимер[а-я]*(?:\\s+печат[а-я]*)?|печат[а-я]*\\s+на\\s+(?:3[\\s-]*[дd]\\s*)?принтер','3D-печать (фотополимер)'],['пмма|pmma|фрезерованн[а-я]*\\s+пластмасс','PMMA (ПММА)'],['вар[её]н[а-я]*\\s+пластмасс|горяч[а-я]*\\s+полимеризац','Варёная пластмасса'],['пластмасс','Пластмасса'],['дисиликат\\s+лития|дисиликат|e[.\\s-]*max|емакс|имакс','Дисиликат лития (E.max)'],['полевошпатн[а-я]*|ваш\\s+платн[а-я]*|алюмосиликат[а-я]*|на\\s+рефрактор[а-я]*|рефрактор[а-я]*','Полевошпатная керамика (рефрактор)'],['металлокерамик|мк\\b','Металлокерамика'],['прессованн[а-я]*\\s+керамик|пресс\\s+керамик','Прессованная керамика'],['керамик','Керамика'],['диоксид\\s+циркония|циркон','Диоксид циркония'],['фрезерованн[а-я]*\\s+титан','Фрезерованный титан'],['титан','Титан'],['кобальт[\\s-]*хром|кхс','КХС'],['золот','Золото']];
    let foundMats = [];

    if (foundMats.length && $('pMat')) $('pMat').value = [...new Set(foundMats)].join(', ');
    const impSys = [
      ['medentik[а-я]*|медентик[а-я]*', 'Medentika'],

      ['osstem|осстем[а-я]*|астем[а-я]*|остем[а-я]*', 'Osstem'],

      ['astra[\\s-]*tech|астр[а-я]*', 'Astra Tech'],
      ['neodent|неодент[а-я]*', 'Neodent'],
      ['dentium|дентиум[а-я]*', 'Dentium'],
      ['ankylos|анкилос[а-я]*', 'Ankylos'],
      ['megagen|мегаджен[а-я]*', 'MegaGen'],
      ['any[\\s-]*ridge|any[\\s-]*rich|enich|enige|эни[\\s-]*ридж[а-я]*|эни[\\s-]*рич[а-я]*|ани[\\s-]*ридж[а-я]*|ани[\\s-]*рич[а-я]*|(?:и\\s+)?не\\s+(?:rich|рич[а-я]*|ридж[а-я]*)', 'AnyRidge'],
      ['alpha[\\s-]*bio|альфа[\\s-]*био', 'Alpha-Bio'],
      ['\\bmis\\b|\\bмис\\b', 'MIS'],

      if (rx.test(low)) { foundImp.push(name); rm(rx); }
    }
   const muRx = /(?:на\s+)?(?:мультиюнит[а-я]*|мульти[\s-]*(?:юнит[а-я]*|unit)|мульт[а-я]*|мультях[а-я]*|мю|муа)(?=\s|[.,;!?]|$)/gi;
   const hasMu = muRx.test(low);
    if (hasMu) rm(muRx);
    if ((foundImp.length || hasMu) && $('pImp')) {
      const sysStr = [...new Set(foundImp)].join(', ');

    }
    const numC = {'один':'1','два':'2','три':'3','четыре':'4'};
    const blM = low.match(/(?:цвет|оттенок|цвета)?\s*(?:б?лич|bleach|bl)\s*(1|2|3|4|один|два|три|четыре)/);

      if (cM && cM.at(1) && $('pCol')) { let v = cM.at(1).toUpperCase().replace(/\s+с\s+половиной/i, '.5').replace(',', '.').replace(/ОДИН|ДВА|ТРИ|ЧЕТЫРЕ/gi, m => numC[m.toLowerCase()]).replace(/\s+/g,''); $('pCol').value = v.replace('А','A').replace('Б','B').replace('С','C').replace('Д','D'); rm(cM.at(0)); }
    }

    if (low.includes('не нужен') || low.includes('сами') || low.includes('привезем') || low.includes('привезём')) {

    } else if (low.includes('курьер') || low.includes('забрать') || low.includes('адрес') || low.includes('улиц') || low.includes('клиник')) {

      if (cm && cm.at(1) && cm.at(1).trim().length > 2 && $('pCour')) { $('pCour').value = cm.at(1).trim(); rm(cm.at(0)); }
    }
        const phM = noteRest.match(/(?:(?:фото\s*протокол[а-я]*|фотографи[а-я]*|фотк[а-я]*|фото[а-я]*|сним[а-я]*|файл[а-я]*)\s+)?(?:отправил[а-я]*|скинул[а-я]*|выслал[а-я]*|переслал[а-я]*|загрузил[а-я]*|в|на)?\s*(?:в\s+)?(телеграм[а-я]*|telegram|тг|макс[а-я]*|max|ватсап[а-я]*|вотсап[а-я]*|whatsapp)/i);
    if (phM && phM.at(1) && $('pPhoto')) {

      rm(phM.at(0));
    }
    const cleanNote = noteRest.replace(/^[\s,.;:\-]+|[\s,.;:\-]+$/g, '').replace(/\s+/g, ' ').trim();
    if ($('pNote')) $('pNote').value = cleanNote.length > 2 ? cleanNote.charAt(0).toUpperCase() + cleanNote.slice(1) : '';
  }
  if ($('aiParseBtn')) $('aiParseBtn').onclick = () => { localParse($('rawText').value); if ($('micStatus')) $('micStatus').textContent = 'Поля заполнены!'; };
  if ($('btnCourier')) $('btnCourier').onclick = () => { $('btnCourier').classList.add('active'); $('btnSelf').classList.remove('active'); if ($('courierBox')) $('courierBox').style.display = 'block'; };
  if ($('btnSelf')) $('btnSelf').onclick = () => { $('btnSelf').classList.add('active'); $('btnCourier').classList.remove('active'); if ($('courierBox')) $('courierBox').style.display = 'none'; if ($('pCour')) $('pCour').value = ''; };
     if ($('clearBtn')) $('clearBtn').onclick = () => { ['rawText','pDoc','pId','pType','pMat','pCol','pImp','pCour','pNote','pPhoto'].forEach(id => { if ($(id)) $(id).value = ''; }); localStorage.removeItem('zakaz_doc'); if ($('btnSelf')) $('btnSelf').click(); if ($('sendStatus')) $('sendStatus').textContent = ''; };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  if (SR) {
    rec = new SR(); rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      let f = '';
      for (let i = 0; i < e.results.length; i++) {
        const it = e.results.item ? e.results.item(i) : e.results.at(i);
        const al = it.item ? it.item(0) : it.at(0);
        if (al && al.transcript) f += al.transcript;
      }
      if ($('rawText')) $('rawText').value = f;
      localParse(f);
    };
    rec.onend = () => { listening = false; if ($('micBtn')) $('micBtn').className = 'mic-btn'; localParse($('rawText').value); if ($('micStatus')) $('micStatus').textContent = 'Готово! Проверьте поля ниже'; };
  }
  if ($('micBtn')) $('micBtn').onclick = () => {
    if (!rec) return;

    else { rec.stop(); }
  };
