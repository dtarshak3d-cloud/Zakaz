<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Быстрый заказ Аршаку</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px 14px 150px; background: #F5F2EB; color: #1A1A1A; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .app { width: 100%; max-width: 480px; background: #FFFFFF; border: 1px solid #DCD7CC; border-radius: 22px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    h1 { margin: 0; font-size: 21px; font-weight: 800; text-align: center; color: #141414; letter-spacing: -0.3px; }
    .sub { text-align: center; font-size: 13px; color: #6E6A61; margin: 4px 0 18px; }
    .card { background: #FAF8F4; border: 1px solid #E3DFD5; border-radius: 16px; padding: 15px; margin-bottom: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; font-size: 14px; color: #222; }
    .clear-btn { background: none; border: none; color: #2B6CB0; text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; font-weight: 500; }
    textarea, input { width: 100%; background: #FFFFFF; border: 1px solid #CFC9BC; border-radius: 11px; color: #141414; padding: 11px 13px; font-size: 15px; outline: none; transition: 0.15s; }
    textarea:focus, input:focus { border-color: #141414; box-shadow: 0 0 0 2px rgba(20,20,20,0.08); }
    textarea::placeholder, input::placeholder { color: #969187; }
    textarea { min-height: 82px; resize: vertical; line-height: 1.45; }
    .ai-btn { width: 100%; padding: 10px; border: 1px solid #CFC9BC; border-radius: 10px; background: #EFECE4; color: #1A1A1A; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { margin-bottom: 11px; }
    label { display: block; font-size: 12px; color: #5C584F; margin-bottom: 5px; font-weight: 600; }
    .delivery-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 11px; }
    .del-btn { padding: 10px; border-radius: 10px; border: 1px solid #CFC9BC; background: #FFFFFF; color: #333; font-size: 13px; font-weight: 600; cursor: pointer; }
    .del-btn.active { background: #1A1A1A; color: #FFFFFF; border-color: #1A1A1A; }
    .submit-btn { width: 100%; padding: 15px; border: none; border-radius: 13px; background: #2E7D32; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px; box-shadow: 0 6px 16px rgba(46,125,50,0.22); }
    .submit-btn:disabled { opacity: 0.6; }
    .send-status { text-align: center; font-size: 13px; font-weight: 600; margin-top: 10px; color: #2E7D32; }
    .mic-dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); border-top: 1px solid #DCD7CC; padding: 10px 16px 16px; display: flex; flex-direction: column; align-items: center; z-index: 999; box-shadow: 0 -6px 24px rgba(0,0,0,0.08); }
    .mic-btn { width: 92px; height: 92px; border-radius: 50%; border: none; background: #1A1A1A; color: #FFFFFF; font-size: 40px; cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,0.22); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .mic-btn.rec { background: #D93838; transform: scale(1.07); box-shadow: 0 8px 26px rgba(217,56,56,0.4); }
    .mic-status { font-size: 12.5px; color: #4A4740; margin-top: 6px; text-align: center; font-weight: 500; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Быстрый заказ Аршаку</h1>
    <div class="sub">Dt. Arshak Petrosyan WORKSHOP</div>
    <div class="card">
      <div class="card-head"><span>1. Голосовая диктовка</span><button type="button" class="clear-btn" id="clearBtn">Очистить всё</button></div>
      <textarea id="rawText" placeholder="Нажмите большую кнопку микрофона внизу экрана и продиктуйте заказ..."></textarea>
      <button type="button" class="ai-btn" id="aiParseBtn">Разобрать текст по полям</button>
    </div>
    <div class="card">
      <div class="card-head"><span>2. Параметры заказа</span></div>
      <div class="field"><label>ID или фамилия пациента</label><input type="text" id="pId" placeholder="Например: Петров или 4512"></div>
      <div class="grid">
        <div class="field"><label>Тип конструкции</label><input type="text" id="pType" placeholder="Коронка, на имплантате..."></div>
        <div class="field"><label>Материал</label><input type="text" id="pMat" placeholder="Цирконий, E.max..."></div>
      </div>
      <div class="field"><label>Цвет</label><input type="text" id="pCol" placeholder="Например: А2, BL1"></div>
      <label>Доставка</label>
      <div class="delivery-btns"><button type="button" class="del-btn active" id="btnCourier">Нужен курьер</button><button type="button" class="del-btn" id="btnSelf">Сами привезём</button></div>
      <div class="field" id="courierBox"><label>Курьер: адрес и время</label><input type="text" id="pCour" placeholder="Откуда и во сколько забрать"></div>
      <button type="button" class="submit-btn" id="sendBtn">Отправить Аршаку в лабораторию ➔</button>
      <div class="send-status" id="sendStatus"></div>
    </div>
  </div>
  <div class="mic-dock">
    <button type="button" class="mic-btn" id="micBtn">🎤</button>
    <div class="mic-status" id="micStatus">Нажмите на микрофон внизу и продиктуйте заказ</div>
  </div>
  <script>
    const GAS_URL = 'https://' + 'script.google' + '.com/macros/s/AKfycbyeHWKmbbvUtTkhXHeXSmJn92by9qfhziAqXFg0K0ACnE6dpIRxnVzZdZjDg912HVsXrg/exec';
    const $ = id => document.getElementById(id);
    function localParse(txt) {
      const low = txt.toLowerCase();
      const stopW = /^(пациент[а-я]*|фамили[яи]|ид|id|номер|карта|коронка|коронки|мост|винир|вкладка|абатмент|протез|бюгель|капа|шаблон|временн[а-я]*|имплантат[а-я]*|имплант[а-я]*|диоксид|циркон[а-я]*|керамик[а-я]*|металлокерам[а-я]*|титан|акрил|нейлон|пластмасс[а-я]*|emax|емакс|pmma|пмма|цвет[а-я]*|оттенок|блич|лич|курьер|доставка|нужен|не|сами|привез[а-я]*|забрать|адрес|улиц[а-я]*|клиник[а-я]*|завтра|сегодня|на|из|с|в|к|по|до|от)$/i;
      const idM = txt.match(/(?:пациент[а-я]*|ид|id|номер|карта|№)\s*(?:в|на)?\s*(\d{1,3}[:\-\s]?\d{2,4})/i) || txt.match(/\b(\d{3,6})\b/);
      if (idM) $('pId').value = idM.at(1).replace(/[:\-\s]/g, '');
      else {
        const famM = txt.match(/(?:пациент[а-я]*|фамили[яи]|для)\s+([а-яё\-]{3,25})/i);
        if (famM && !stopW.test(famM.at(1))) $('pId').value = famM.at(1).replace(/^[а-яё]/, s => s.toUpperCase());
        else { const w = txt.split(/[\s,]+/).map(x => x.replace(/[^а-яё\-]/gi, '')).filter(x => x.length >= 3 && !stopW.test(x)); if (w.length) $('pId').value = w.at(0).replace(/^[а-яё]/, s => s.toUpperCase()); }
      }
      const types = [['коронка на имплант','Коронка на имплантате'],['на имплант','Коронка на имплантате'],['коронка','Коронка'],['коронки','Коронки'],['мост','Мостовидный протез'],['винир','Винир'],['вкладка','Вкладка'],['абатмент','Индивидуальный абатмент'],['протез','Съёмный протез'],['бюгель','Бюгельный протез'],['капа','Капа'],['шаблон','Хирургический шаблон'],['временн','Временная коронка']];
      for (const [k, v] of types) if (low.includes(k)) { $('pType').value = v; break; }
      const mats = [['циркон','Диоксид циркония'],['emax','E.max'],['е макс','E.max'],['емакс','E.max'],['металлокерам','Металлокерамика'],['керамик','Керамика'],['титан','Титан'],['акрил','Акрил'],['нейлон','Нейлон'],['pmma','PMMA'],['пмма','PMMA'],['пластмасс','Пластмасса']];
      for (const [k, v] of mats) if (low.includes(k)) { $('pMat').value = v; break; }
      const blM = low.match(/(?:б?лич|bleach|bl)\s*(1|2|3|4|один|два|три|четыре)/), caM = low.match(/цвета\s*([1-4](?:\.5)?)/);
      if (blM) { const m = {'один':'1','два':'2','три':'3','четыре':'4'}; $('pCol').value = 'BL' + (m[blM.at(1)] || blM.at(1)); }
      else if (caM) $('pCol').value = 'A' + caM.at(1);
      else { const cM = txt.match(/(?:цвет|оттенок)?\s*(?:^|\s)([аaбbсcдd]\s*[1-4](?:\.5)?|ом\s*[1-3])(?=\s|$|[.,])/i); if (cM) $('pCol').value = cM.at(1).toUpperCase().replace(/\s+/g,'').replace('А','A').replace('Б','B').replace('С','C').replace('Д','D'); }
      if (low.includes('не нужен') || low.includes('сами') || low.includes('привезем') || low.includes('привезём')) $('btnSelf').click();
      else if (low.includes('курьер') || low.includes('забрать') || low.includes('адрес') || low.includes('улиц') || low.includes('клиник')) {
        $('btnCourier').click();
        const cm = txt.match(/(?:нужен\s+курьер|курьер|забрать|адрес|по\s+адресу|из\s+клиники|с\s+улицы|ул\.?)\s*[:\-]?\s*(.+)$/i);
        if (cm && cm.at(1).trim().length > 2) $('pCour').value = cm.at(1).trim();
      }
    }
    $('rawText').addEventListener('input', e => localParse(e.target.value));
    $('aiParseBtn').onclick = () => { localParse($('rawText').value); $('micStatus').textContent = 'Поля заполнены!'; };
    $('btnCourier').onclick = () => { $('btnCourier').classList.add('active'); $('btnSelf').classList.remove('active'); $('courierBox').style.display = 'block'; if ($('pCour').value === 'Сами привезём') $('pCour').value = ''; };
    $('btnSelf').onclick = () => { $('btnSelf').classList.add('active'); $('btnCourier').classList.remove('active'); $('courierBox').style.display = 'none'; $('pCour').value = 'Сами привезём'; };
    $('clearBtn').onclick = () => { ['rawText','pId','pType','pMat','pCol','pCour'].forEach(k => $(k).value = ''); $('btnCourier').click(); $('micStatus').textContent = 'Нажмите на микрофон внизу и продиктуйте заказ'; $('sendStatus').textContent = ''; };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition, isYa = /YaBrowser/i.test(navigator.userAgent);
    let rec = null, listening = false;
    if (SR && !isYa) {
      rec = new SR(); rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = true;
      rec.onresult = e => { let f = ''; for (let i = 0; i < e.results.length; i++) { const it = e.results.item ? e.results.item(i) : e.results.at(i), al = it.item ? it.item(0) : it.at(0); if (al && al.transcript) f += al.transcript; } $('rawText').value = f; localParse(f); };
      rec.onend = () => { listening = false; $('micBtn').className = 'mic-btn'; $('micStatus').textContent = 'Готово! Проверьте поля выше'; };
    }
    $('micBtn').onclick = () => { if (rec) { if (!listening) { rec.start(); listening = true; $('micBtn').className = 'mic-btn rec'; $('micStatus').textContent = 'Говорите... Нажмите ещё раз, чтобы остановить'; } else rec.stop(); } else { $('rawText').focus(); $('micStatus').innerHTML = 'В Яндекс Браузере нажмите <b>Win + H</b> и диктуйте'; } };
    $('sendBtn').onclick = async () => {
      const btn = $('sendBtn'); btn.disabled = true; $('sendStatus').textContent = 'Отправляем на Dt.Arshak@yandex.ru...';
      try { const q = new URLSearchParams({ action: 'sendEmail', id: $('pId').value, type: $('pType').value, material: $('pMat').value, color: $('pCol').value, courier: $('pCour').value, rawText: $('rawText').value }); await fetch(GAS_URL + '?' + q.toString(), { mode: 'no-cors' }); $('sendStatus').textContent = '✓ Отправлено на Dt.Arshak@yandex.ru!'; }
      catch (e) { $('sendStatus').textContent = 'Ошибка: ' + e.message; } finally { btn.disabled = false; }
    };
  </script>
</body>
</html>
